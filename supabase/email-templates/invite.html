<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>You’re invited</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #0f1412;
      color: #b8c4bc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
      -webkit-text-size-adjust: 100%;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #0f1412; width: 100%"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 480px; width: 100%"
          >
            <tr>
              <td
                style="
                  background: #171d1a;
                  border: 1px solid rgba(242, 247, 244, 0.1);
                  border-radius: 8px;
                  padding: 28px 24px;
                "
              >
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 13px;
                    font-weight: 600;
                    letter-spacing: 0.06em;
                    text-transform: uppercase;
                    color: #7dffb3;
                  "
                >
                  KinesoScore
                </p>
                <h1
                  style="
                    margin: 0 0 12px;
                    font-size: 24px;
                    line-height: 1.25;
                    font-weight: 700;
                    color: #f2f7f4;
                  "
                >
                  You’re invited
                </h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #b8c4bc">
                  Tap the button below to accept your invitation and create your account.
                </p>

                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{ .ConfirmationURL }}" style="height:48px;v-text-anchor:middle;width:240px;" arcsize="10%" stroke="f" fillcolor="#7dffb3">
                  <w:anchorlock/>
                  <center style="color:#0f1412;font-family:sans-serif;font-size:16px;font-weight:700;">
                    Accept invitation
                  </center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-- -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td align="center" style="border-radius: 6px; background: #7dffb3">
                      <a
                        href="{{ .ConfirmationURL }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="
                          display: block;
                          width: 100%;
                          box-sizing: border-box;
                          min-height: 48px;
                          line-height: 48px;
                          padding: 0 20px;
                          font-size: 16px;
                          font-weight: 700;
                          text-align: center;
                          text-decoration: none;
                          color: #0f1412;
                          border-radius: 6px;
                        "
                      >
                        Accept invitation
                      </a>
                    </td>
                  </tr>
                </table>
                <!--<![endif]-->

                <p
                  style="
                    margin: 24px 0 8px;
                    font-size: 13px;
                    line-height: 1.45;
                    color: #93a39b;
                  "
                >
                  Button not working? Open this link:
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 1.45;
                    word-break: break-all;
                    overflow-wrap: anywhere;
                  "
                >
                  <a
                    href="{{ .ConfirmationURL }}"
                    target="_blank"
                    rel="noopener noreferrer"
                    style="color: #7dffb3; text-decoration: underline"
                    >{{ .ConfirmationURL }}</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
